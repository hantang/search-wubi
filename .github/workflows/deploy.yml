name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - data/**
      - docs/**
      - src/**
      - mkdocs.yml
      - .github/workflows/deploy.yml
  # schedule:
  #   - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write

    env:
      OUT: site

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # with:
        #   submodule: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build Data
        run: bash deploy-mkdocs.sh ${{ env.OUT }}

      - name: Setup pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.OUT }}
      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v5
